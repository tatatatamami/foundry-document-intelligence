name: Build and validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore FoundryDocumentIntelligence.sln

      - name: Build
        run: dotnet build FoundryDocumentIntelligence.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test FoundryDocumentIntelligence.sln --configuration Release --no-build --no-restore

      - name: Validate Bicep
        run: |
          az bicep install
          az bicep lint --file infra/bicep/main.bicep
          az bicep build --file infra/bicep/main.bicep --stdout > /dev/null
